server:
  port: 8083

spring:
  config:
    import: optional:file:.env[.properties],optional:file:.env.local[.properties]
  application:
    name: payment

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  qr:
    baseUrl: ${QR_BASEURL}
